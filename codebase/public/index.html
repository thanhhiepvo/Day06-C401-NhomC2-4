<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
  <title>Quick Meal Picker — Chatbot</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="chat-app">
    <header class="chat-header">
      <div class="chat-header-main">
        <span class="chat-avatar" aria-hidden="true">🍊</span>
        <div>
          <h1 class="chat-title">Gợi ý món AI</h1>
          <p class="chat-subtitle">ShopeeFood · augment · không tự đặt</p>
        </div>
      </div>
      <div class="chat-header-actions">
        <span id="ai-status" class="chat-ai-badge">AI…</span>
        <button type="button" id="btn-reset" class="chat-icon-btn" title="Cuộc trò chuyện mới">↺</button>
      </div>
    </header>

    <details class="chat-settings">
      <summary>Tùy chọn nhanh (giờ ăn, ngân sách)</summary>
      <div class="chat-settings-body">
        <label class="chat-setting">
          <span>Giờ ăn</span>
          <select id="time-slot">
            <option value="">Chưa rõ</option>
            <option value="trưa">Trưa</option>
            <option value="tối">Tối</option>
            <option value="khuya">Khuya</option>
          </select>
        </label>
        <label class="chat-setting">
          <span>Ngân sách (đ)</span>
          <input id="budget" type="number" min="0" step="1000" placeholder="VD: 50000" value="" />
        </label>
        <label class="chat-setting chat-setting-full">
          <span>Đã đặt gần đây</span>
          <input id="history" type="text" placeholder="VD: cơm tấm, bún bò" value="" />
        </label>
      </div>
    </details>

    <main id="chat-messages" class="chat-messages" aria-live="polite"></main>

    <div id="quick-replies" class="chat-quick hidden"></div>

    <footer class="chat-composer">
      <form id="chat-form" class="chat-form">
        <input
          id="chat-input"
          type="text"
          class="chat-input"
          placeholder="VD: Trưa 50k, ăn no, không cay…"
          autocomplete="off"
          required
        />
        <button type="submit" id="btn-send" class="chat-send" aria-label="Gửi">➤</button>
      </form>
    </footer>
  </div>
  <script src="/app.js" type="module"></script>
</body>
</html>
